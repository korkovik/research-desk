name: weekly digest

on:
  schedule:
    # Target: 06:00 Europe/Prague, every Tuesday. One edition a week of five
    # papers, which at the measured ~$0.90 an edition is about $3.90 a month.
    #
    # GitHub cron is UTC and does not follow DST, so a single rule drifts by an
    # hour for half the year. The usual workaround is two month-scoped rules
    # ("0 4 * 3-10 *" / "0 5 * 11,12,1,2 *"), but months are the wrong unit:
    # EU DST turns on the last Sunday of March and off the last Sunday of
    # October, so a month-scoped pair is still an hour out for roughly the first
    # four weeks of March and the last week of October.
    #
    # Instead both rules fire every Tuesday and a gate step decides, using the
    # runner's tzdata, whether this is the 06:00 Prague one. That is exact all
    # year with no switchover week to get wrong, and the losing run costs a few
    # seconds. Actions minutes are free on public repositories, so the second
    # firing is genuinely free.
    # Deliberately not on the hour. GitHub queues scheduled runs by load and
    # the top of the hour is the worst minute to ask for; measured delays here
    # reached ten hours while these sat at ':00'.
    - cron: '17 4 * * 2'  # Tuesday 06:17 Prague while CEST (UTC+2)
    - cron: '17 5 * * 2'  # Tuesday 06:17 Prague while CET  (UTC+1)
    # Long after both firings have had their chance: did a page actually appear,
    # and is it actually being served? A run that skips is green, and a green
    # skip that produced nothing is the one failure nobody would notice.
    - cron: '23 11 * * 3' # Wednesday 13:23 / 12:23 Prague, the day after an edition
  workflow_dispatch:
    inputs:
      force:
        description: 'Republish today even if an edition already exists'
        type: boolean
        default: false
      run_watchdog:
        description: 'Run only the stall check, not the digest'
        type: boolean
        default: false
      watchdog_date:
        description: 'Date for the stall check (default: today in Prague). Only for testing that it still detects a missing edition.'
        type: string
        default: ''
      simulate_failure:
        description: 'Testing only: run with the Anthropic key blanked, so the run fails before any API call and nothing is spent'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# A queued run must wait, never race. Two runs pushing generated output at once
# is exactly how state/seen.json gets corrupted, and cancel-in-progress would be
# worse still: it could kill a run between spending the API money and committing
# the result, losing the edition but keeping the cost.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    # Wednesday's 11:23 UTC firing is the stall check, not a digest attempt.
    # This line and the watchdog's `if:` compare that cron string exactly, so
    # they have to move with the schedule; test/workflows.test.ts holds them
    # together. If one drifted, the stall check's firing would start a paid run.
    if: github.event.schedule != '23 11 * * 3' && inputs.run_watchdog != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Decide whether this firing is the real one BEFORE touching the app.
      # It cannot be left to the app: run.ts refuses a same-day republish with
      # exit code 1, so letting the losing cron reach it would paint a red X on
      # a day that actually succeeded, and §9's failure signal would stop
      # meaning anything.
      - id: gate
        name: Is this the 06:00 Prague firing?
        run: |
          set -euo pipefail
          day=$(TZ=Europe/Prague date +%F)
          hour=$(TZ=Europe/Prague date +%H)
          echo "day=$day" >> "$GITHUB_OUTPUT"
          # When this job began, so the ledger can tell this run's run.log line
          # from an older one.
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Prague local time: $day, hour $hour"

          decide() {
            echo "proceed=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "Gate: proceed=$1 ($2)"
          }

          if [ "${{ inputs.force }}" = "true" ] || [ "${{ inputs.simulate_failure }}" = "true" ]; then
            decide true dispatch-override
          elif [ -f "archive/$day.json" ]; then
            # Already published, by the other firing or by hand. A manual
            # dispatch now takes this branch too, so dispatching on a published
            # day exercises exactly the skip the second cron firing takes daily.
            decide false already-published
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            decide true dispatch
          elif [ "$((10#$hour))" -ge 6 ]; then
            # A floor, deliberately with no ceiling. The first version capped
            # this at 09:59 and that is what froze the site for a week: GitHub
            # delayed these crons by four to ten hours, every firing landed
            # past the ceiling, and each one skipped green having published
            # nothing. What stops the second firing double-publishing is the
            # archive check above.
            decide true scheduled
          else
            decide false before-0600-prague
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install
        if: steps.gate.outputs.proceed == 'true'
        run: npm ci

      - name: Build today's edition
        id: build
        if: steps.gate.outputs.proceed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -o pipefail   # tee must not swallow the run's exit code
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            # A real failure at no cost, for testing the non-success path. With
            # the key blanked, run.ts stops before its first HTTP request — what
            # a revoked key does — and crashes without writing a run.log line,
            # the hardest case for the ledger. No papers fetched, no Claude
            # calls, and the archive is never touched.
            ANTHROPIC_API_KEY= npx tsx src/cli.ts run --skip-if-published 2>&1 | tee /tmp/build.log
          elif [ "${{ inputs.force }}" = "true" ]; then
            npx tsx src/cli.ts run --force 2>&1 | tee /tmp/build.log
          else
            # --skip-if-published makes "today is already published" a calm exit 0
            # instead of exit 1. The guard still refuses to overwrite the page —
            # it just stops reporting a benign no-op as a failed run, which would
            # otherwise send a failure notification on a morning when nothing was
            # wrong, and teach the reader to ignore the ones that matter.
            npx tsx src/cli.ts run --skip-if-published 2>&1 | tee /tmp/build.log
          fi

      # One line per run, whatever happened, and a commit per run to carry it.
      # GitHub disables a public repo's schedule after 60 days without activity,
      # and when the ledger only moved on success a long outage made no commits
      # at all — the outage itself would eventually switch off the schedule
      # meant to recover from it. See scripts/record-run.mjs and commit-run.sh.
      - name: Record the run in the ledger
        id: record
        if: always()
        env:
          DAY: ${{ steps.gate.outputs.day }}
          RUN_STARTED_AT: ${{ steps.gate.outputs.started }}
          GATE_PROCEED: ${{ steps.gate.outputs.proceed }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/record-run.mjs

      # Always commits the ledger line; commits the edition only when the build
      # published one. A run that did not publish has every edition path put
      # back exactly as main has it first, so the old guarantee — a failed run
      # never overwrites a good archive — still holds underneath the new one.
      - name: Commit the ledger, and the edition if one was published
        if: always()
        env:
          DAY: ${{ steps.gate.outputs.day || 'unknown-day' }}
          PUBLISH: ${{ steps.gate.outputs.proceed == 'true' && steps.build.outcome == 'success' && inputs.simulate_failure != true }}
          OUTCOME: ${{ steps.record.outputs.outcome || 'recorded' }}
        run: bash scripts/commit-run.sh

      # §9 failure visibility without a daily email: nothing is sent on a good
      # day, and a bad day opens (or comments on) a single dated issue, which
      # GitHub notifies on. A run that fails is also a red X in the Actions tab
      # and turns the README badge red.
      - name: Report a failure
        if: failure() && steps.gate.outputs.proceed == 'true' && inputs.simulate_failure != true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const day = '${{ steps.gate.outputs.day }}';

            // Running out of Anthropic budget is this project's most likely
            // recurring failure — it killed a week of editions in August, and
            // it will recur every month the spend outruns the cap. It deserves
            // to be named in the title, because "Weekly digest failed" sends you
            // reading logs for a bug that is not there.
            let log = '';
            try { log = fs.readFileSync('/tmp/build.log', 'utf8'); } catch {}
            const capped = /reached your specified API usage limits/.test(log);
            const regain = (log.match(/regain access on ([0-9-]+ at [0-9:]+ UTC)/) || [])[1];

            const title = capped
              ? `Anthropic spend cap reached — no editions until it resets`
              : `Weekly digest failed: ${day}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = capped ? [
              `The ${day} run stopped because the Anthropic account hit its`,
              `configured spend limit${regain ? `. Access returns **${regain}**` : ''}.`,
              ``,
              `**This is a budget limit, not a bug.** Nothing is broken and no code`,
              `change will fix it. Until the cap resets or is raised, every run will`,
              `fail the same way and no edition will be published — and the cap is`,
              `shared with any other project using the same key, which will also stop.`,
              ``,
              `\`state/runs.jsonl\` holds the real per-run cost if you want to see`,
              `where the month went.`,
              ``,
              `Log: ${url}`,
            ].join('\n') : [
              `The ${day} run did not publish an edition.`,
              ``,
              `Log: ${url}`,
              ``,
              `Only this run's line in \`state/runs.jsonl\` was committed. The archive`,
              `and \`state/seen.json\` are untouched and the previous edition is still being`,
              `served. Per §9 the edition is simply missing rather than padded with older papers.`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'run-failure',
            });
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['run-failure'],
              });
            }

  # ---------------------------------------------------------------------------
  # The stall check.
  #
  # Every other signal here is about a run that went wrong. This one is about a
  # run that never happened, or happened and never reached the reader: both
  # firings delayed out of their window, the schedule disabled, Pages failing to
  # deploy. Those all leave a green tick and a site quietly frozen on an old
  # edition, which is the worst failure this project has — Tom reads every edition
  # and would assume silence meant success.
  #
  # It checks the two things that have to be true for him to have something to
  # read: the edition is committed, and the live origin actually serves it.
  # ---------------------------------------------------------------------------
  watchdog:
    if: github.event.schedule == '23 11 * * 3' || inputs.run_watchdog == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - id: probe
        name: Is today's edition committed and served?
        run: |
          set -uo pipefail
          # Checks YESTERDAY, not today, and that is the point. Today's digest
          # may still be sitting in GitHub's scheduler queue — delays of four to
          # ten hours are normal here — so asking "is today published yet?" races
          # a run that has not had its turn, and every lost race is a false alarm.
          # Yesterday is settled: whatever was going to happen has happened. The
          # cost is that a stall is reported a day late, which is the right trade
          # for an alert that is only ever raised when something is genuinely
          # wrong. A digest run that fails outright still opens its own issue
          # immediately, so a real failure is not waiting on this. This job fires
          # on Wednesday, so "yesterday" is the Tuesday edition.
          day="${{ inputs.watchdog_date }}"
          [ -z "$day" ] && day=$(TZ=Europe/Prague date -d 'yesterday' +%F 2>/dev/null || TZ=Europe/Prague date -v-1d +%F)
          echo "day=$day" >> "$GITHUB_OUTPUT"

          committed=no
          [ -f "archive/$day.json" ] && committed=yes

          url="https://korkovik.github.io/research-desk/archive/$day.html"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo "000")
          served=no
          [ "$code" = "200" ] && served=yes

          echo "day=$day committed=$committed served=$served (HTTP $code)"
          echo "committed=$committed" >> "$GITHUB_OUTPUT"
          echo "served=$served" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

          {
            echo "### Stall check — $day"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Edition committed | $committed |"
            echo "| Served from Pages | $served (HTTP $code) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raise a stall
        if: steps.probe.outputs.committed != 'yes' || steps.probe.outputs.served != 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const day = '${{ steps.probe.outputs.day }}';
            const committed = '${{ steps.probe.outputs.committed }}';
            const served = '${{ steps.probe.outputs.served }}';
            const code = '${{ steps.probe.outputs.code }}';
            const title = `No edition published for ${day}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The stall check looked for **${day}**'s edition — a full day after`,
              `its scheduled firings — and did not find a complete one.`,
              ``,
              `| | |`,
              `|---|---|`,
              `| Edition committed to \`archive/\` | ${committed} |`,
              `| Served from the Pages origin | ${served} (HTTP ${code}) |`,
              ``,
              committed === 'yes'
                ? `The page exists in the repository but the site is not serving it, so`
                + ` this is a Pages deployment problem rather than a pipeline one.`
                : `No page was produced. Either both firings were delayed past their`
                + ` window, the schedule is disabled, or the digest run failed —`
                + ` check for a separate "Weekly digest failed" issue.`,
              ``,
              `Log: ${url}`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'run-failure',
            });
            const match = open.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['run-failure'],
              });
            }
            core.setFailed(`No complete edition for ${day}.`);
