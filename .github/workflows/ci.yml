name: check

on:
  push:
    branches: [main]
    # The daily job pushes generated pages back to main. Re-running the test
    # suite because an archive page changed proves nothing and burns minutes.
    paths-ignore:
      - 'archive/**'
      - 'index.html'
      - 'state/**'
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
